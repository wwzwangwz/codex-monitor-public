name: Windows build

on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build installer and portable EXE
        run: npx electron-builder --win nsis portable --publish never
      - name: Test source and packaged Windows boundaries
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Monitor-Windows-${{ github.sha }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14
