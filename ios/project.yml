name: CodexMonitorIOS
options:
  bundleIdPrefix: com.codexmonitor
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  CodexMonitorIOS:
    type: application
    platform: iOS
    sources:
      - path: CodexMonitorIOS/App
      - path: CodexMonitorIOS/Core
      - path: CodexMonitorIOS/Resources/Assets.xcassets
        buildPhase: resources
      - path: CodexMonitorIOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: CodexMonitorIOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: Codex Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: 扫描电脑端显示的 Codex Monitor 配对二维码。
        NSLocalNetworkUsageDescription: 连接同一局域网内的 Mac 或 Windows 电脑并监控 Codex 会话。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codexmonitor.ios
        PRODUCT_NAME: Codex Monitor
        MARKETING_VERSION: 0.1.8
        CURRENT_PROJECT_VERSION: 8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CodexMonitorIOS/Resources/CodexMonitorIOS.entitlements
        APNS_ENVIRONMENT: development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          APNS_ENVIRONMENT: production
schemes:
  CodexMonitorIOS:
    build:
      targets:
        CodexMonitorIOS: all
    run:
      config: Debug
    archive:
      config: Release
